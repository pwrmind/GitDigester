<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-200 font-sans antialiased min-h-screen">

  <!-- Шапка -->
  <header class="border-b border-slate-800/60 bg-slate-950/80 backdrop-blur sticky top-0 z-10">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="{{ '/' | relative_url }}" class="flex items-center gap-2 group">
        <span class="text-2xl">🤖</span>
        <div>
          <h1 class="text-lg font-extrabold tracking-tight text-white group-hover:text-blue-400 transition">{{ site.title }}</h1>
          <p class="text-xs text-slate-500">{{ site.description }}</p>
        </div>
      </a>
      <a href="https://github.com/pwrmind/GitDigester" target="_blank"
         class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
        GitHub
      </a>
    </div>
  </header>

  <!-- Контент -->
  <main class="max-w-3xl mx-auto px-4 py-10">
    {{ content }}
  </main>

  <!-- Футер -->
  <footer class="border-t border-slate-800/60 mt-16 py-6 text-center text-xs text-slate-600">
    <p>© {{ "now" | date: "%Y" }} {{ site.title }} · Сгенерировано локально через Ollama</p>
  </footer>

</body>
</html>
