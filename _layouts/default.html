<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>

  <!-- Tailwind CSS (правильный CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

    /* Стилизация Markdown-контента без плагина typography */
    .post-content { color: #cbd5e1; line-height: 1.75; font-size: 0.95rem; }
    .post-content > * + * { margin-top: 0.9rem; }
    .post-content h2,
    .post-content h3,
    .post-content h4 {
      color: #f1f5f9;
      font-weight: 700;
      margin-top: 1.6rem;
      margin-bottom: 0.6rem;
      letter-spacing: -0.01em;
    }
    .post-content h2 { font-size: 1.35rem; }
    .post-content h3 { font-size: 1.1rem; }
    .post-content h4 { font-size: 1rem; }
    .post-content ul,
    .post-content ol { padding-left: 1.4rem; }
    .post-content ul { list-style: disc; }
    .post-content ol { list-style: decimal; }
    .post-content li { margin: 0.35rem 0; }
    .post-content li::marker { color: #6366f1; }
    .post-content a { color: #818cf8; text-decoration: underline; text-underline-offset: 3px; }
    .post-content a:hover { color: #a5b4fc; }
    .post-content strong { color: #f1f5f9; font-weight: 700; }
    .post-content em { color: #e2e8f0; }
    .post-content code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85em;
      background: #1e293b;
      color: #a5b4fc;
      padding: 0.15em 0.4em;
      border-radius: 4px;
    }
    .post-content pre {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
      font-size: 0.85rem;
    }
    .post-content pre code { background: transparent; padding: 0; color: #e2e8f0; }
    .post-content blockquote {
      border-left: 3px solid #6366f1;
      padding-left: 1rem;
      color: #94a3b8;
      font-style: italic;
    }
    .post-content hr { border-color: #1e293b; margin: 1.5rem 0; }

    /* Скрыть Alpine-контент до инициализации */
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-[#08090d] text-slate-300 antialiased min-h-screen">

  <!-- Декоративный градиент сверху -->
  <div class="fixed top-0 left-0 right-0 h-64 pointer-events-none -z-10"
       style="background: radial-gradient(ellipse at top, rgba(99,102,241,0.15), transparent 60%);"></div>

  <!-- Шапка: сквозная для всех страниц, Alpine-скоуп локальный -->
  <header class="border-b border-slate-800/60"
          x-data
          x-init="$store.feed.search = new URLSearchParams(location.search).get('q') || ''">
    <div class="max-w-3xl mx-auto px-5 py-5 flex items-center justify-between gap-4">

      <!-- Логотип -->
      <a href="{{ '/' | relative_url }}" class="flex items-center gap-3 group shrink-0">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white font-black text-sm shadow-lg shadow-indigo-500/20">GD</div>
        <div>
          <div class="text-base font-bold text-white tracking-tight group-hover:text-indigo-400 transition">{{ site.title }}</div>
          <div class="text-[11px] mono text-slate-500 uppercase tracking-wider hidden sm:block">{{ site.description }}</div>
        </div>
      </a>

      <!-- Поиск + ссылка на GitHub -->
      <div class="flex items-center gap-2 flex-1 max-w-xs justify-end">
        <input type="search"
               x-model="$store.feed.search"
               @keydown.enter.prevent="if (window.location.pathname !== '{{ '/' | relative_url }}') window.location.href = '{{ '/' | relative_url }}?q=' + encodeURIComponent($store.feed.search)"
               placeholder="Поиск по постам..."
               class="w-full max-w-[180px] px-3 py-1.5 text-xs bg-slate-900 border border-slate-800 rounded-lg text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500/50 transition">
        <a href="https://github.com/pwrmind/GitDigester" target="_blank"
           class="text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-800 hover:border-indigo-500/50 hover:text-indigo-400 text-slate-400 transition shrink-0">
          GitHub ↗
        </a>
      </div>
    </div>
  </header>

  <!-- Контент страницы -->
  <main class="max-w-3xl mx-auto px-5 py-12">
    {{ content }}
  </main>

  <!-- Футер -->
  <footer class="border-t border-slate-800/60 mt-20 py-8 text-center text-xs text-slate-600">
    <p class="mono">{{ site.title }} · {{ "now" | date: "%Y" }} · Powered by Ollama locally</p>
  </footer>

  <!-- Регистрация Alpine.store ДО инициализации Alpine -->
  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.store('feed', { search: '' });
    });
  </script>
</body>
</html>
