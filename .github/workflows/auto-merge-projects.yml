name: Auto-merge Project Submissions

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # Шаг 1: проверяем, что PR меняет только projects.json
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      only_projects: ${{ steps.changed.outputs.only_projects }}
    steps:
      - name: Get changed files
        id: changed
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const paths = files.data.map(f => f.filename);
            const onlyProjects = paths.length === 1 && paths[0] === 'projects.json';
            core.setOutput('only_projects', onlyProjects.toString());
            core.setOutput('paths', paths.join(', '));

  # Шаг 2: валидация и авто-мерж (только если меняется projects.json)
  validate-and-merge:
    needs: check-changes
    if: needs.check-changes.outputs.only_projects == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch (safe)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Backup base projects.json
        run: cp projects.json base_projects.json

      - name: Fetch PR projects.json via API
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.repos.getContent({
              owner: context.payload.pull_request.head.repo.owner.login,
              repo: context.payload.pull_request.head.repo.name,
              path: 'projects.json',
              ref: context.payload.pull_request.head.sha,
            });
            const content = Buffer.from(response.data.content, 'base64').toString('utf-8');
            require('fs').writeFileSync('projects.json', content);

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install jsonschema

      - name: Validate
        run: python validate_projects.py

      - name: Comment and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment $PR_NUMBER --body "✅ Валидация пройдена. Проект добавлен в ленту. Сливаю PR..."
          gh pr merge $PR_NUMBER --squash

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '❌ **Валидация не пройдена.**\n\nУбедитесь, что PR:\n- изменяет только `projects.json`\n- содержит валидный JSON по схеме `projects.schema.json`\n- не содержит `<` и `>` в текстовых полях\n- не удаляет существующие проекты\n- не содержит дубликатов\n\nИсправьте и запушьте — проверка запустится заново.'
            });